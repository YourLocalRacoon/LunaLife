</header>

<div class="app-shell">
<aside class="sidebar">
<div class="side-label">YOUR UNIVERSE</div>
<nav id="nav">
<button class="nav-item active" data-page="home">✧ <span>Today</span></button>
<button class="nav-item" data-page="schedule">▦ <span>Schedule</span></button>
<button class="nav-item" data-page="nutrition">♡ <span>Nutrition</span></button>
<button class="nav-item" data-page="cycle">☾ <span>Cycle tracker</span></button>
<button class="nav-item" data-page="wellness">✿ <span>Wellness</span></button>
<button class="nav-item" data-page="habits">✧ <span>Habits &amp; goals</span></button>
<button class="nav-item" data-page="lists">☷ <span>Lists &amp; notes</span></button>
<button class="nav-item" data-page="journal">✎ <span>Journal</span></button>
<button class="nav-item" data-page="settings">⚙ <span>Settings &amp; sync</span></button>
</nav>
<div class="sidebar-note">
<span>✦</span>
<p>Small steps still move you across the universe.</p>
</div>
</aside>

<main id="main" tabindex="-1"></main>
</div>

<div class="mobile-more-menu" id="mobile-more-menu" hidden aria-label="More LunaLife sections">
<button data-page="wellness">✿ <span>Wellness</span></button>
<button data-page="habits">✧ <span>Habits &amp; goals</span></button>
<button data-page="lists">☷ <span>Lists &amp; notes</span></button>
<button data-page="journal">✎ <span>Journal</span></button>
<button data-page="settings">⚙ <span>Settings &amp; sync</span></button>
</div>

<nav class="mobile-nav" id="mobile-nav">
<button class="active" data-page="home">✧<small>Today</small></button>
<button data-page="schedule">▦<small>Plan</small></button>
<button data-page="nutrition">♡<small>Food</small></button>
<button data-page="cycle">☾<small>Cycle</small></button>
<button id="mobile-more-button" data-more aria-controls="mobile-more-menu" aria-expanded="false">✦<small>More</small></button>
</nav>

<dialog id="modal">
<form method="dialog" id="modal-form">
<div class="modal-head">
<h2 id="modal-title">Add entry</h2>
<button class="icon-btn" value="cancel" aria-label="Close">×</button>
</div>
<div id="modal-body"></div>
<div class="modal-actions">
<button class="btn ghost" value="cancel">Cancel</button>
<button class="btn primary" id="modal-save" value="default">Save</button>
</div>
</form>
</dialog>

<!-- LunaLife startup error detector -->
<script>
(function(){
  function showError(message){
    const main = document.getElementById('main');
    if(!main) return;

    main.innerHTML = '';

    const box = document.createElement('div');
    box.style.cssText =
      'margin:20px;padding:20px;background:#2b153d;color:white;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere';

    box.textContent = 'LUNALIFE STARTUP ERROR\n\n' + message;
    main.appendChild(box);
  }

  window.addEventListener('error', function(e){
    showError(e.message || 'A script failed to load. ' + (e.filename || ''));
  });

  window.addEventListener('unhandledrejection', function(e){
    showError(
      e.reason?.stack ||
      e.reason?.message ||
      String(e.reason)
    );
  });
})();
</script>

<script type="module" src="./app.js"></script>

</body>
</html>
