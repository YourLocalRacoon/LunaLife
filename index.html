<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24103f">
  <meta name="description" content="LunaLife — your personal life planner in a royal purple galaxy.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>LunaLife</title>
</head>
<body>
  <div class="stars"></div>
  <header class="topbar">
    <button class="brand" data-page="home" aria-label="LunaLife home"><span class="brand-moon">☾</span><span><b>LunaLife</b><small>YOUR LIFE, IN THE STARS</small></span></button>
    <div class="top-actions"><span id="sync-status" class="sync-pill">● On this device</span><button class="icon-btn" id="install-btn" hidden>＋ Install</button><button class="avatar" id="account-btn" title="Account">✦</button></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-label">YOUR UNIVERSE</div>
      <nav id="nav">
        <button class="nav-item active" data-page="home">✧ <span>Today</span></button>
        <button class="nav-item" data-page="schedule">▦ <span>Schedule</span></button>
        <button class="nav-item" data-page="nutrition">♡ <span>Nutrition</span></button>
        <button class="nav-item" data-page="cycle">☾ <span>Cycle tracker</span></button>
        <button class="nav-item" data-page="wellness">✿ <span>Wellness</span></button>
        <button class="nav-item" data-page="habits">✧ <span>Habits & goals</span></button>
        <button class="nav-item" data-page="lists">☷ <span>Lists & notes</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Settings & sync</span></button>
      </nav>
      <div class="sidebar-note"><span>✦</span><p>Small steps still move you across the universe.</p></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="mobile-nav" id="mobile-nav">
    <button class="active" data-page="home">✧<small>Today</small></button><button data-page="schedule">▦<small>Plan</small></button><button data-page="nutrition">♡<small>Food</small></button><button data-page="cycle">☾<small>Cycle</small></button><button data-page="wellness">✿<small>More</small></button>
  </nav>
  <dialog id="modal"><form method="dialog" id="modal-form"><div class="modal-head"><h2 id="modal-title">Add entry</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></div><div id="modal-body"></div><div class="modal-actions"><button class="btn ghost" value="cancel">Cancel</button><button class="btn primary" id="modal-save" value="default">Save</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
